<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7">
<title>secondmind</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="shell">

  <header id="topbar">
    <button id="logoBtn" class="icon-btn" aria-label="Startseite" title="Startseite">
      <img src="assets/logo.svg" alt="" class="logo-mark">
    </button>

    <button id="calBtn" class="icon-btn" aria-label="Kalender" title="Kalender">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="15" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
    </button>

    <button id="menuBtn" class="icon-btn" aria-label="Menü öffnen" aria-haspopup="menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/></svg>
    </button>

    <div class="searchwrap">
      <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M8.5 3a5.5 5.5 0 1 0 3.4 9.8l3.3 3.3a1 1 0 0 0 1.4-1.4l-3.3-3.3A5.5 5.5 0 0 0 8.5 3Zm0 2a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7Z"/></svg>
      <input id="search" type="search" placeholder="Suchen" autocomplete="off" spellcheck="false" aria-label="Suchen">
      <button id="searchClear" class="search-clear" aria-label="Suche löschen" hidden>&times;</button>
    </div>

    <button id="syncBtn" class="sync-dot" aria-label="Synchronisierungsstatus" title="Synchronisierung">
      <span class="dot" data-state="idle"></span>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <button id="fab" aria-label="Neu erstellen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
  </button>

</div>

<div id="drawerRoot" hidden>
  <div class="drawer-scrim" data-close></div>
  <aside class="drawer" role="dialog" aria-label="Navigation">
    <div class="drawer-head">
      <img src="assets/logo.svg" alt="" class="drawer-logo">
      <div>
        <div class="drawer-title">secondmind</div>
        <div class="drawer-sub" id="drawerSync">nicht verbunden</div>
      </div>
    </div>
    <nav class="drawer-nav">
      <a href="#/archiv" data-route="archiv"><span class="di">🗂</span> Archiv</a>
      <a href="#/memory" data-route="memory"><span class="di">🧠</span> Memory</a>
      <a href="#/einstellungen" data-route="einstellungen"><span class="di">⚙︎</span> Einstellungen</a>
    </nav>
    <div class="drawer-foot">
      <div class="drawer-stat" id="drawerStats">–</div>
      <div class="drawer-ver">secondmind 1.0</div>
    </div>
  </aside>
</div>

<div id="sheetRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
